<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #1a1d23; --muted: #6b7280;
    --accent: #4f46e5; --accent-hover: #4338ca; --bad: #dc2626; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); margin: 0; line-height: 1.5;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; padding: 1.25rem; }
  form { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
         padding: 1.5rem; width: 100%; max-width: 340px; }
  h1 { font-size: 1.05rem; margin: 0 0 1.1rem; }
  label { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em;
          color: var(--muted); font-weight: 600; margin-bottom: .3rem; }
  input { width: 100%; padding: .6rem .7rem; font-size: 1rem; margin-bottom: .9rem;
          border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { width: 100%; cursor: pointer; padding: .65rem; font-size: .9rem; font-weight: 600;
           border: none; border-radius: 8px; background: var(--accent); color: #fff; }
  button:hover { background: var(--accent-hover); }
  .error { color: var(--bad); font-size: .8rem; margin-bottom: .8rem; }
  .error:empty { display: none; }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <h1>Admin login</h1>
  <div class="error">{{ERROR}}</div>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
</body>
</html>
