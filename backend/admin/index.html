<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Concierge admin</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e5e7eb; --text: #1a1d23; --muted: #6b7280;
    --accent: #4f46e5; --accent-hover: #4338ca; --good: #059669; --good-bg: #ecfdf5;
    --bad: #dc2626; --bad-bg: #fef2f2; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); margin: 0; line-height: 1.5; }

  /* everything you need, in one bar, no navigation */
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--card);
            border-bottom: 1px solid var(--border); padding: .7rem 1.5rem;
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: .95rem; margin-right: auto; }
  .brand span { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: .5rem; }
  select { padding: .45rem .6rem; font-size: .85rem; border: 1px solid var(--border);
           border-radius: 8px; background: #fff; color: var(--text); min-width: 230px; }
  button { cursor: pointer; padding: .45rem .9rem; font-size: .82rem; font-weight: 600;
           border: none; border-radius: 8px; background: var(--accent); color: #fff; }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .6; cursor: default; }
  .bar-msg { font-size: .78rem; color: var(--muted); }
  .bar-msg.error { color: var(--bad); }

  main { padding: 1.25rem 1.5rem 3rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
           gap: .8rem; margin-bottom: 1rem; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .8rem; }
  .stat .label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
  .stat .value { font-size: 1.2rem; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: .8rem; table-layout: fixed;
          background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  th { text-align: left; padding: .5rem .7rem; background: var(--bg); color: var(--muted);
       font-weight: 600; text-transform: uppercase; font-size: .66rem; letter-spacing: .03em; }
  td { padding: .55rem .7rem; border-top: 1px solid var(--border); overflow-wrap: break-word;
       vertical-align: top; }
  td.msg-cell { white-space: normal; line-height: 1.35; }
  td.dim { color: var(--muted); }
  .tiny { font-size: .66rem; color: var(--muted); }
  .err { color: var(--bad); font-size: .7rem; margin-top: .25rem; }
  .sent { color: var(--good); font-size: .66rem; margin-top: .25rem; }
  .cached { color: var(--good); font-size: .64rem; }
  .kind { display: inline-block; background: #eef2ff; color: var(--accent); border-radius: 4px;
          padding: 0 .3rem; font-size: .62rem; font-weight: 700; text-transform: uppercase; }

  /* keys tucked away - open only when you need to paste one */
  details.keys { margin-bottom: 1rem; }
  details.keys summary { cursor: pointer; font-size: .8rem; color: var(--muted); padding: .3rem 0; }
  .provider-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
                   gap: .8rem; margin-top: .6rem; }
  .provider-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem; }
  .provider-name { font-weight: 700; font-size: .9rem; text-transform: capitalize; margin-bottom: .35rem; }
  .pill { display: inline-block; padding: .12rem .5rem; border-radius: 999px; font-size: .7rem;
          font-weight: 600; margin-bottom: .6rem; }
  .pill.ok { color: var(--good); background: var(--good-bg); }
  .pill.no { color: var(--bad); background: var(--bad-bg); }
  .key-row { display: flex; gap: .4rem; }
  .key-row input { flex: 1; padding: .45rem; font-size: .82rem; border: 1px solid var(--border); border-radius: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Concierge admin <span id="active-label"></span></div>
  <select id="model-select" title="Provider and model"></select>
  <button id="save-model" onclick="saveSettings(this)">Set active</button>
  <button class="secondary" onclick="loadUsage()">Refresh</button>
  <span class="bar-msg" id="bar-msg"></span>
</div>

<main>
  <details class="keys">
    <summary>API keys — encrypted, effective immediately, no redeploy</summary>
    <div class="provider-grid" id="providers"></div>
  </details>

  <div class="stats" id="totals"></div>

  <table id="usage-table">
    <colgroup>
      <col style="width:11%"><col style="width:25%"><col style="width:29%"><col style="width:11%">
      <col style="width:6%"><col style="width:6%"><col style="width:12%">
    </colgroup>
    <thead><tr>
      <th>Time</th><th>Message</th><th>Reply</th><th>Model</th><th>In</th><th>Out</th><th>Cost</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</main>

<script>
let currentSettings = null;

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function barMsg(text, isError) {
  const el = document.getElementById('bar-msg');
  el.className = 'bar-msg' + (isError ? ' error' : '');
  el.textContent = text || '';
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const text = await res.text();
  if (!res.ok) {
    // Errors aren't always JSON - a 500 or a proxy error returns HTML, and
    // blindly parsing it hid the real status behind a JSON parse error.
    let detail = text;
    try { detail = JSON.parse(text).detail || text; } catch (_) {}
    if (/^\s*</.test(detail)) detail = 'server returned an error page';
    throw new Error(`${res.status} ${res.statusText}: ${String(detail).slice(0, 200)}`);
  }
  return text ? JSON.parse(text) : null;
}

let modelLists = {};

// Fast: key status + active model, straight from the DB. Never waits on a network call.
async function loadSettings() {
  currentSettings = await api('/admin/settings');
  renderProviders();
  renderModelSelect();
}

// Slow: hits each provider's API. Runs on its own so it can never block the page
// or leave the Save button stuck on "Saving…".
async function loadModels() {
  try {
    modelLists = await api('/admin/models');
    renderModelSelect();
    const warnings = Object.values(modelLists).filter(m => !m.live && m.note).map(m => m.note);
    if (warnings.length) barMsg(warnings.join(' '), true);
  } catch (e) {
    barMsg('Could not load model lists: ' + e.message, true);
  }
}

// One dropdown: every provider/model pair the configured keys can actually call.
function renderModelSelect() {
  const sel = document.getElementById('model-select');
  const active = `${currentSettings.active_provider}|${currentSettings.active_model}`;
  let html = '';
  for (const [provider, info] of Object.entries(currentSettings.providers)) {
    const live = modelLists[provider] || {};
    // Priced models until the live list arrives, then whatever the provider reports.
    const models = (live.models && live.models.length) ? live.models : info.priced_models;
    const priced = new Set(info.priced_models || []);
    html += `<optgroup label="${esc(provider)}${
      live.live ? ' — ' + models.length + ' models' : (live.note ? ' (partial list)' : ' …')}">` +
      models.map(m => {
        const val = `${provider}|${m}`;
        return `<option value="${esc(val)}" ${val === active ? 'selected' : ''}>${
          esc(provider)} / ${esc(m)}${priced.has(m) ? '' : ' — no pricing'}</option>`;
      }).join('') + '</optgroup>';
  }
  sel.innerHTML = html;
  document.getElementById('active-label').textContent =
    `· ${currentSettings.active_provider} / ${currentSettings.active_model}`;
}

async function saveSettings(btn) {
  const [provider, model] = document.getElementById('model-select').value.split('|');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('/admin/settings', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({provider, model}),
    });
    await loadSettings();
    barMsg(`Active: ${provider} / ${model}`);
  } catch (e) {
    barMsg(e.message, true);
  }
  btn.disabled = false; btn.textContent = 'Set active';
}

function renderProviders() {
  const el = document.getElementById('providers');
  el.innerHTML = '';
  for (const [name, info] of Object.entries(currentSettings.providers)) {
    const div = document.createElement('div');
    div.className = 'provider-card';
    div.innerHTML = `
      <div class="provider-name">${esc(name)}</div>
      <span class="pill ${info.configured ? 'ok' : 'no'}">${
        info.configured ? esc(info.masked) + ' · ' + esc(info.source) : 'not configured'}</span>
      <div class="key-row">
        <input type="password" id="key-${esc(name)}" placeholder="paste key">
        <button onclick="saveKey('${esc(name)}', this)">Save</button>
      </div>`;
    el.appendChild(div);
  }
}

async function saveKey(provider, btn) {
  const input = document.getElementById('key-' + provider);
  if (!input.value.trim()) return;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const saved = await api('/admin/keys', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({provider, api_key: input.value.trim()}),
    });
    input.value = '';
    // Update straight from the save response - no reload, no waiting on anything.
    Object.assign(currentSettings.providers[provider],
                  {configured: true, masked: saved.masked, source: saved.source});
    renderProviders();
    barMsg(`${provider} key saved ✓`);
    loadModels();          // refresh the dropdown in the background
  } catch (e) {
    barMsg('Could not save key: ' + e.message, true);
  } finally {
    // Always reset the button, even on the success path where the card is re-rendered.
    btn.disabled = false; btn.textContent = 'Save';
  }
}

async function loadUsage() {
  const data = await api('/admin/usage?limit=100');
  const t = data.totals;
  document.getElementById('totals').innerHTML = `
    <div class="stat"><div class="label">Replies</div><div class="value">${t.count}</div></div>
    <div class="stat"><div class="label">Input</div><div class="value">${t.input_tokens}</div></div>
    <div class="stat"><div class="label">Cached</div><div class="value">${t.cache_read_tokens ?? 0}</div></div>
    <div class="stat"><div class="label">Output</div><div class="value">${t.output_tokens}</div></div>
    <div class="stat"><div class="label">Cost</div><div class="value">$${(t.cost_usd || 0).toFixed(4)}</div></div>`;

  // Oldest first, so the conversation reads top-to-bottom like a chat.
  const rows = [...data.rows].reverse();
  document.querySelector('#usage-table tbody').innerHTML = rows.length ? rows.map(r => `
    <tr>
      <td class="dim">${esc(r.created_at).slice(5, 16)}<br><span class="tiny">${esc(r.phone_number) || '[api]'}</span></td>
      <td class="msg-cell">${esc(r.user_message)}${
        r.media_kind && r.media_kind !== 'text' ? ' <span class="kind">' + esc(r.media_kind) + '</span>' : ''}</td>
      <td class="msg-cell">${esc(r.reply_text)}${
        r.error ? '<div class="' + (String(r.error).startsWith('sent') ? 'sent' : 'err') + '">'
                  + esc(r.error) + '</div>' : ''}</td>
      <td class="dim">${esc(r.model)}<br><span class="tiny">${r.tool_call_count} tools · ${r.turn_count} turns · ${
        r.latency_ms != null ? (r.latency_ms / 1000).toFixed(1) + 's' : '-'}</span></td>
      <td>${r.input_tokens}${r.cache_read_tokens ? '<br><span class="cached">+' + r.cache_read_tokens + ' cached</span>' : ''}</td>
      <td>${r.output_tokens}</td>
      <td>${r.cost_usd != null ? '$' + r.cost_usd.toFixed(5) : '-'}</td>
    </tr>`).join('')
    : `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:1.2rem;">No replies yet.</td></tr>`;
  barMsg(`Updated ${new Date().toLocaleTimeString()}`);
}

loadSettings();   // instant
loadUsage();      // instant
loadModels();     // fills the dropdown when the providers answer
</script>
</body>
</html>
